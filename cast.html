		// =====================================
		// CARD GENERATION
		// =====================================

		const castList = document.getElementById("cast-card-list");
		const castFilters = document.querySelectorAll(".cast-filter");

		function createCastCard(character) {
			const card = document.createElement("article");
			card.className = "cast-card";
			card.dataset.category = character.category;

			const image = document.createElement("img");
			image.className = "cast-card-image";
			image.src = character.image;
			image.alt = character.name;
			image.loading = "lazy";

			if (character.pixelArt) {
				image.classList.add("pixel-art");
			}

			const info = document.createElement("div");
			info.className = "cast-card-info";

			const name = document.createElement("h3");
			name.textContent = character.name;
			info.appendChild(name);

			// 説明文が入力されている場合だけ表示
			if (character.description) {
				const description = document.createElement("p");
				description.textContent = character.description;
				info.appendChild(description);
			}

			// 出演作品が登録されている場合だけ表示
			if (character.games.length > 0) {
				const heading = document.createElement("h4");
				heading.textContent = "APPEARS IN";

				const games = document.createElement("div");
				games.className = "cast-card-games";

				character.games.forEach(game => {
					if (game.url && game.url !== "#") {
						const link = document.createElement("a");
						link.href = game.url;
						link.textContent = game.title + " ↗";
						link.target = "_blank";
						link.rel = "noopener noreferrer";
						games.appendChild(link);
					} else {
						const text = document.createElement("span");
						text.className = "cast-game-title";
						text.textContent = game.title;
						games.appendChild(text);
					}
				});

				info.append(heading, games);
			}

			card.append(image, info);
			return card;
		}

		// カードを表示
		characters.forEach(character => {
			castList.appendChild(createCastCard(character));
		});

		// =====================================
		// FILTER
		// =====================================

		castFilters.forEach(button => {
			button.addEventListener("click", () => {
				const selected = button.dataset.category;

				castFilters.forEach(filter => {
					filter.classList.toggle("active", filter === button);
				});

				castList.querySelectorAll(".cast-card").forEach(card => {
					card.hidden =
						selected !== "all" &&
						card.dataset.category !== selected;
				});
			});
		});
