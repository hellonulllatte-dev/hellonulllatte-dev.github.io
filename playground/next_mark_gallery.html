<script>'use strict';const $=s=>document.querySelector(s);
const defs=[['sankaku','さんかく','tri',1],['nagasankaku','ながさんかく','tall',1],['hiratasankaku','ひらたさんかく','flat',1],['smooth_sankaku','なめらかさんかく','tri',0],['smooth_nagasankaku','なめらかながさんかく','tall',0],['smooth_hiratasankaku','なめらかひらたさんかく','flat',0],['shirosankaku','しろさんかく','outline',1],['smooth_shirosankaku','なめらかしろさんかく','outline',0],['yama','やま','chevron',1],['smooth_yama','なめらかやま','chevron',0],['yajirushi','やじるし','down',1],['smooth_yajirushi','なめらかやじるし','down',0]];

for(const [key,name,shape,pixel,motion] of [['heart','はーと','heart',0,'bounce'],['heart_spark','はーと','heart',1,'spark'],['star','ほし','star',0,'spin'],['star_spark','ほし','star',1,'spark'],['diamond','ひしがた','diamond',0,'spin'],['sparkle','きらきら','sparkle',0,'spark']]){let n=items.filter(x=>x.key.startsWith(key)).length+1;items.push({key,name:name+String(n).padStart(2,'0'),filename:key+'_'+String(n).padStart(2,'0'),shape,pixel:!!pixel,motion,running:false,hover:false,start:0})}
let galleryColorIndex=0;const GALLERY_COLORS=['#a37370','#c27f6f','#6b5258'];let selected=null,direction=0,renderingExport=false,mainColor='#a37370',shadeColor='#3a323c',bgColor='#f5e9df',speed=1,outputSize=64;

function parseHex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function shape(g,type){g.beginPath();switch(type){case'tri':g.moveTo(2,4);g.lineTo(14,4);g.lineTo(8,14);g.closePath();break;case'tall':g.moveTo(5,2);g.lineTo(11,2);g.lineTo(8,15);g.closePath();break;case'flat':g.moveTo(1,5);g.lineTo(15,5);g.lineTo(8,11);g.closePath();break;case'outline':g.moveTo(2,4);g.lineTo(14,4);g.lineTo(8,14);g.closePath();g.lineWidth=1.6;g.lineJoin='miter';g.stroke();return;case'chevron':g.moveTo(2,4);g.lineTo(8,10);g.lineTo(14,4);g.lineTo(14,8);g.lineTo(8,14);g.lineTo(2,8);g.closePath();break;case'down':g.moveTo(6,1);g.lineTo(10,1);g.lineTo(10,8);g.lineTo(14,8);g.lineTo(8,15);g.lineTo(2,8);g.lineTo(6,8);g.closePath();break;case'circle':g.arc(8,8,5.5,0,Math.PI*2);break;case'square':g.rect(3,3,10,10);break;case'heart':g.moveTo(8,14);g.bezierCurveTo(3,11,0,7,2.5,4);g.bezierCurveTo(5,1,7,3,8,5);g.bezierCurveTo(10,1,14,2,14,5);g.bezierCurveTo(16,8,11,12,8,14);break;case'star':for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?3:7,x=8+Math.cos(a)*r,y=8+Math.sin(a)*r;i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath();break;case'sparkle':g.moveTo(8,0);g.lineTo(10,6);g.lineTo(16,8);g.lineTo(10,10);g.lineTo(8,16);g.lineTo(6,10);g.lineTo(0,8);g.lineTo(6,6);g.closePath();break;case'diamond':g.moveTo(8,1);g.lineTo(15,8);g.lineTo(8,15);g.lineTo(1,8);g.closePath();break;}g.fill()}
function drawIcon(c,item,phase,galleryMode=false){const w=c.canvas.width,h=c.canvas.height;c.clearRect(0,0,w,h);const native=item.pixel?24:96;const temp=item._tmp||(item._tmp=document.createElement('canvas'));temp.width=temp.height=native;const g=temp.getContext('2d');g.clearRect(0,0,native,native);g.save();g.scale(native/24,native/24);g.translate(12,12);const p=phase%1,peak=Math.sin(Math.PI*Math.min(1,p/.65)),wave=Math.sin(p*Math.PI*2);let move=0,alpha=1,rot=0,scale=1;switch(item.motion){case'bounce':move=-Math.max(0,peak)*2.4;break;case'blink':alpha=p<.28||p>.54?1:0;break;case'slideY':move=p<.6?3*(p/.6):3*(1-(p-.6)/.4);break;case'spin':rot=p*Math.PI*2;break;case'spark':scale=.82+.18*(.5+.5*wave);alpha=.65+.35*(.5+.5*wave);break}const dir=(item===selected&&($('#fittingDialog').open||renderingExport))?direction:0;g.rotate(dir*Math.PI/2);g.translate(0,item.pixel?Math.round(move):move);g.rotate(item.pixel?Math.round(rot/(Math.PI/2))*(Math.PI/2):rot);g.scale(item.pixel?1:scale,item.pixel?1:scale);g.globalAlpha=alpha;g.translate(-8,-8);g.save();g.translate(item.pixel?1:.7,item.pixel?1:.7);g.fillStyle=galleryMode?'#3a323c':shadeColor;g.strokeStyle=galleryMode?'#3a323c':shadeColor;shape(g,item.shape);g.restore();g.fillStyle=galleryMode?(item.galleryColor||'#a37370'):mainColor;g.strokeStyle=galleryMode?(item.galleryColor||'#a37370'):mainColor;shape(g,item.shape);g.restore();c.imageSmoothingEnabled=!item.pixel;c.drawImage(temp,0,0,w,h)}
const gallery=$('#gallery');items.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='tile'+(item.pixel?' pixel':'');b.innerHTML=item.pixel?'<canvas width="48" height="48"></canvas>':'<canvas width="64" height="64"></canvas>';b.setAttribute('aria-label',item.name);gallery.appendChild(b);item.btn=b;item.canvas=b.querySelector('canvas');b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){item.hover=true;item.start=performance.now()}});b.addEventListener('pointerleave',()=>item.hover=false);b.addEventListener('click',()=>toggle(item));});

function openModal(){if(!selected)return;$('#previewName').textContent=selected.name;direction=0;document.querySelectorAll('[data-dir]').forEach(b=>b.classList.toggle('chosen',b.dataset.dir==='0'));$('#msg').textContent='';$('#fittingDialog').showModal()}
$('#takeBtn').onclick=openModal;$('#closeDialog').onclick=()=>$('#fittingDialog').close();$('#fittingDialog').addEventListener('click',e=>{if(e.target===$('#fittingDialog'))$('#fittingDialog').close()});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{direction=+b.dataset.dir;document.querySelectorAll('[data-dir]').forEach(x=>x.classList.toggle('chosen',x===b))});
const fields=[['colorMain','hexMain',()=>mainColor,v=>mainColor=v],['colorShade','hexShade',()=>shadeColor,v=>shadeColor=v],['colorBg','hexBg',()=>bgColor,v=>bgColor=v]];function sync(){fields.forEach(([a,b,get])=>{$('#'+a).value=get();$('#'+b).value=get()});const display=$('#display'),sample=display.querySelector('.sample-dialog');display.style.setProperty('--preview-surround',bgColor);display.style.setProperty('--preview-frame',shadeColor);sample.style.setProperty('--preview-bg',bgColor);sample.style.setProperty('--preview-frame',shadeColor);sample.style.setProperty('--preview-text',mainColor)}fields.forEach(([a,b,get,set])=>{$('#'+a).oninput=e=>{set(e.target.value);$('#'+b).value=e.target.value;$('#palette').value='custom';sync()};$('#'+b).onchange=e=>{if(/^#[0-9a-f]{6}$/i.test(e.target.value)){set(e.target.value);$('#palette').value='custom'}sync()}});$('#palette').onchange=e=>{const p=PRESETS[e.target.value];if(p){[mainColor,shadeColor,bgColor]=p;sync()}};$('#outputSize').oninput=e=>{outputSize=+e.target.value;$('#sizeNum').textContent=outputSize+'px';$('#largePreview').style.width=Math.min(outputSize,100)+'px';$('#largePreview').style.height=Math.min(outputSize,100)+'px'};$('#speed').oninput=e=>{speed=+e.target.value;$('#speedNum').textContent=speed.toFixed(1)+'×'};sync();
function frameCanvas(item,phase,size=outputSize){let cv=document.createElement('canvas');cv.width=cv.height=size;renderingExport=true;drawIcon(cv.getContext('2d'),item,phase);renderingExport=false;return cv}
function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);$('#msg').textContent='お持ち帰りありがとう！ '+name}
function asBlob(canvas,type='image/png'){return new Promise(r=>canvas.toBlob(r,type))}
$('#pngBtn').onclick=async()=>download(await asBlob(frameCanvas(selected,.25)),selected.filename+'.png');
$('#sheetBtn').onclick=async()=>{const cols=4,rows=3,size=outputSize,sheet=document.createElement('canvas');sheet.width=cols*size;sheet.height=rows*size;const g=sheet.getContext('2d');g.imageSmoothingEnabled=!selected.pixel;for(let i=0;i<12;i++){const f=frameCanvas(selected,i/12);g.drawImage(f,(i%cols)*size,Math.floor(i/cols)*size)}download(await asBlob(sheet),selected.filename+'_sheet.png')};
// Small dependency-free looping GIF89a writer (RGB332 palette + transparent index).
const byte16=(arr,v)=>arr.push(v&255,(v>>8)&255);
function lzw(indices){ // GIF-compatible LZW stream, regularly cleared before 9-bit code size must expand.
 const CLEAR=256,END=257;const bytes=[];let bits=0,buffer=0;
 const emit=(code)=>{buffer|=code<<bits;bits+=9;while(bits>=8){bytes.push(buffer&255);buffer>>>=8;bits-=8}};
 for(let i=0;i<indices.length;i+=128){emit(CLEAR);for(let j=i;j<Math.min(indices.length,i+128);j++)emit(indices[j])}
 emit(END);if(bits)bytes.push(buffer&255);return bytes;
}

function gifBlob(item){const W=outputSize,H=outputSize,N=12,arr=[];const ascii=s=>{for(let i=0;i<s.length;i++)arr.push(s.charCodeAt(i))};ascii('GIF89a');byte16(arr,W);byte16(arr,H);arr.push(0xf7,0,0);const aColor=parseHex(mainColor),bColor=parseHex(shadeColor);
for(let i=0;i<256;i++){if(item.pixel){const col=i===1?aColor:i===2?bColor:[0,0,0];arr.push(...col)}else{const r=(i>>5)&7,g=(i>>2)&7,b=i&3;arr.push(Math.round(r*255/7),Math.round(g*255/7),Math.round(b*255/3))}}arr.splice(13,3,0,0,0); // transparent palette entry
arr.push(0x21,0xff,11);ascii('NETSCAPE2.0');arr.push(3,1,0,0,0);
for(let n=0;n<N;n++){const cv=frameCanvas(item,n/N),px=cv.getContext('2d').getImageData(0,0,W,H).data;const indexes=new Uint8Array(W*H);for(let i=0;i<indexes.length;i++){let j=i*4;if(px[j+3]<110){indexes[i]=0;continue}if(item.pixel){const d1=(px[j]-aColor[0])**2+(px[j+1]-aColor[1])**2+(px[j+2]-aColor[2])**2,d2=(px[j]-bColor[0])**2+(px[j+1]-bColor[1])**2+(px[j+2]-bColor[2])**2;indexes[i]=d1<=d2?1:2}else{let r=px[j]>>5,g=px[j+1]>>5,b=px[j+2]>>6;indexes[i]=Math.max(1,(r<<5)|(g<<2)|b)}}const delay=Math.max(3,Math.round(11/speed));arr.push(0x21,0xf9,4,0x09,delay&255,(delay>>8)&255,0,0);arr.push(0x2c);byte16(arr,0);byte16(arr,0);byte16(arr,W);byte16(arr,H);arr.push(0);arr.push(8);const data=lzw(indexes);for(let i=0;i<data.length;i+=255){let part=data.slice(i,i+255);arr.push(part.length,...part)}arr.push(0)}arr.push(0x3b);return new Blob([new Uint8Array(arr)],{type:'image/gif'})}
$('#gifBtn').onclick=()=>{try{download(gifBlob(selected),selected.filename+'.gif')}catch(e){console.error(e);$('#msg').textContent='GIF出力でエラーが起きました。'}};

</script></body></html>
