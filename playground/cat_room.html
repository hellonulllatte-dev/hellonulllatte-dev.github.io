<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ded0c7">
  <title>猫部屋 / CAT ROOM</title>
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <style>
    @font-face { font-family:MaruMonica; src:url('../fonts/MaruMonica.ttf') format('truetype'); font-display:swap; }
    :root { --ink:#3a323c; --plum:#6b5258; --rose:#a37370; --peach:#cca795; --paper:#d7c1b4; --cream:#ded0c7; }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--cream); }
    body { min-height:100%; margin:0; color:var(--ink); background:var(--cream); font:16px/1.5 MaruMonica,ui-monospace,monospace; }
    button,a { font:inherit; color:inherit; }
    button { cursor:pointer; }
    a { text-decoration:none; }
    button:focus-visible,a:focus-visible,canvas:focus-visible { outline:3px solid var(--plum); outline-offset:3px; }
    .site { max-width:850px; margin:0 auto; padding:10px 12px 16px; }
    .site-top { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:0 3px 9px; }
    .brand { font-size:12px; font-weight:900; letter-spacing:.13em; }
    .back { font-size:11px; border:1px solid var(--rose); border-radius:999px; padding:6px 10px; white-space:nowrap; }
    .app { border:3px solid var(--plum); border-radius:9px; overflow:hidden; background:var(--cream); }
    .appbar { height:12px; border-bottom:2px solid var(--plum); background:var(--plum); }
    .appbar-pattern { width:100%; height:100%; background:repeating-linear-gradient(90deg,transparent 0 14px,var(--rose) 14px 21px,transparent 21px 33px); }
    .head { min-height:55px; padding:9px 14px; border-bottom:2px solid var(--peach); display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .head h1 { margin:0; font-size:19px; line-height:1.2; letter-spacing:.08em; }
    .head h1 span { font-size:.69em; }
    .profile-button { border:1px solid var(--rose); background:transparent; border-radius:5px; padding:7px 12px; font-size:12px; min-height:34px; white-space:nowrap; }
    .profile-button:hover { background:var(--paper); }
    .content { padding:10px 14px 10px; }
    .stage-shell { overflow:hidden; border:2px solid var(--plum); border-radius:6px; background:var(--rose); }
    #catStage { display:block; width:100%; height:auto; aspect-ratio:720 / 240; background:var(--rose); image-rendering:pixelated; touch-action:manipulation; cursor:pointer; }
    .treat-row { display:flex; align-items:center; justify-content:center; padding-top:7px; }
    .treat-source { display:flex; align-items:center; gap:8px; background:transparent; border:0; border-radius:5px; min-width:80px; min-height:39px; padding:3px 9px; touch-action:none; user-select:none; -webkit-user-select:none; }
    .treat-source:hover { background:var(--paper); }
    .treat-source:active { background:var(--peach); }
    .treat-source svg { display:block; width:30px; height:30px; image-rendering:pixelated; flex:none; }
    .treat-source span { font-size:12px; color:var(--plum); }
    .drag-ghost { position:fixed; z-index:60; pointer-events:none; display:none; transform:translate(-50%,-50%); width:42px; height:42px; align-items:center; justify-content:center; }
    .drag-ghost svg { display:block; width:38px; height:38px; image-rendering:pixelated; }
    .drag-ghost.visible { display:flex; }
    .profile-modal { width:min(530px,calc(100% - 28px)); max-height:calc(100dvh - 28px); padding:0; overflow:auto; border:3px solid var(--plum); border-radius:9px; background:var(--cream); color:var(--ink); font:inherit; }
    .profile-modal::backdrop { background:rgba(35,35,46,.43); }
    .modal-head { position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--paper); border-bottom:2px solid var(--rose); padding:10px 14px; }
    .modal-head strong { font-size:17px; letter-spacing:.12em; }
    .modal-close { min-width:35px; min-height:35px; font-size:22px; line-height:1; border:1px solid var(--rose); border-radius:4px; background:var(--cream); }
    .profiles { padding:2px 15px 12px; }
    .cat-profile { display:grid; grid-template-columns:72px minmax(0,1fr); gap:13px; align-items:center; padding:13px 0; }
    .cat-profile + .cat-profile { border-top:1px solid var(--peach); }
    .profile-portrait { width:72px; height:72px; border:1px solid var(--plum); border-radius:5px; display:grid; place-items:center; background:var(--rose); }
    .profile-portrait canvas { width:72px; height:72px; image-rendering:pixelated; }
    .profile-name { margin:0 0 2px; font-size:18px; line-height:1.2; }
    .profile-type { color:var(--plum); font-size:12px; font-weight:normal; }
    .profile-description { margin:5px 0; font-size:13px; line-height:1.6; }
    .profile-origin { margin:6px 0 0; font-size:12px; color:var(--plum); }
    .profile-origin a { text-decoration:underline; text-underline-offset:2px; }
    .profile-origin a:hover { color:var(--ink); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(max-width:540px) {
      .site { padding:8px 7px 10px; }
      .brand,.back { font-size:10px; }
      .head { padding:8px 10px; min-height:49px; }
      .head h1 { font-size:16px; }
      .profile-button { font-size:11px; min-height:32px; padding:5px 8px; }
      .content { padding:7px 7px 8px; }
      .treat-row { padding-top:5px; }
      .cat-profile { grid-template-columns:60px minmax(0,1fr); gap:10px; }
      .profile-portrait,.profile-portrait canvas { width:60px; height:60px; }
      .profile-description { font-size:12px; }
    }
    @media(prefers-reduced-motion:reduce) { .drag-ghost { transition:none; } }
  </style>
</head>
<body>
  <div class="site">
    <div class="site-top">
      <div class="brand">NULLLATTE / PLAYGROUND</div>
      <a class="back" href="../playground.html">← PLAYGROUND</a>
    </div>
    <main class="app">
      <div class="appbar" aria-hidden="true"><div class="appbar-pattern"></div></div>
      <header class="head">
        <h1 id="roomTitle">猫部屋 <span lang="en">/ CAT ROOM</span></h1>
        <button class="profile-button" id="showProfile" type="button" aria-haspopup="dialog">PROFILE</button>
      </header>
      <section class="content" id="roomContent" aria-label="猫部屋">
        <div class="stage-shell">
          <canvas id="catStage" width="720" height="240" tabindex="0" role="button" aria-label="猫3匹。クリックでなでる。Enterキーで順番になでられます。"></canvas>
        </div>
        <div class="treat-row">
          <button type="button" class="treat-source" id="treatSource" aria-label="おやつ。ドラッグして猫にあげる。キーボードではEnterキーで順番にあげる。" title="おやつを猫までドラッグ">
            <svg viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges"><path fill="#78575e" d="M4 2h8v2h2v8h-2v2H4v-2H2V4h2z"/><path fill="#584540" d="M4 4h8v8H4z"/><path fill="#cca795" d="M5 5h2v2H5zm5 3h2v2h-2z"/><path fill="#a37370" d="M7 10h2v2H7z"/></svg>
            <span id="treatLabel">おやつ ∞</span>
          </button>
        </div>
      </section>
    </main>
  </div>
  <div class="drag-ghost" id="dragGhost" aria-hidden="true">
    <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#78575e" d="M4 2h8v2h2v8h-2v2H4v-2H2V4h2z"/><path fill="#584540" d="M4 4h8v8H4z"/><path fill="#cca795" d="M5 5h2v2H5zm5 3h2v2h-2z"/><path fill="#a37370" d="M7 10h2v2H7z"/></svg>
  </div>
  <dialog class="profile-modal" id="profileModal" aria-labelledby="profileTitle">
    <div class="modal-head"><strong id="profileTitle">CAT PROFILE</strong><button type="button" id="closeProfile" class="modal-close" aria-label="閉じる">×</button></div>
    <div class="profiles">
      <section class="cat-profile">
        <div class="profile-portrait"><canvas id="portraitBoss" width="32" height="32" aria-label="BOSSのドット絵" role="img"></canvas></div>
        <div><h2 class="profile-name">BOSS <span class="profile-type" id="typeBoss">/ 白猫</span></h2><p class="profile-description" id="descBoss">偉いのかどうかは不明。鎮座している。飼い主の賞金で悠々暮らしている。今はHPに居座っている。</p><p class="profile-origin"><span id="originBoss">出演作品：</span><span id="workBoss">ノンストップランサー（没作品）</span><span> / </span><a href="../about.html" id="linkBoss">About</a></p></div>
      </section>
      <section class="cat-profile">
        <div class="profile-portrait"><canvas id="portraitNox" width="32" height="32" aria-label="ノクス君のドット絵" role="img"></canvas></div>
        <div><h2 class="profile-name">NOX <span class="profile-type" id="typeNox">/ 黒猫</span></h2><p class="profile-description" id="descNox">怪盗アルバの愛猫。活発で働き者。</p><p class="profile-origin"><span id="originNox">出演作品：</span><a href="https://unityroom.com/games/koyoi-kimi-wo-ubaimashou" target="_blank" rel="noopener noreferrer" id="linkNox">今宵、君を奪いましょう♡</a></p></div>
      </section>
      <section class="cat-profile">
        <div class="profile-portrait"><canvas id="portraitRich" width="32" height="32" aria-label="RICHのドット絵" role="img"></canvas></div>
        <div><h2 class="profile-name">RICH <span class="profile-type" id="typeRich">/ 茶白猫</span></h2><p class="profile-description" id="descRich">裕福なお姉さんの寵愛を受けている。働く必要がない。のんびり屋。</p><p class="profile-origin"><span id="originRich">出演作品：</span><a href="https://unityroom.com/games/mada-shimenaide" target="_blank" rel="noopener noreferrer" id="linkRich">まだ閉めないで、店主様！</a></p></div>
      </section>
    </div>
  </dialog>
  <div class="sr-only" role="status" aria-live="polite" id="announce"></div>
  <script src="../i18n.js"></script>
  <script>
  (() => {
    'use strict';
    const canvas = document.getElementById('catStage');
    const ctx = canvas.getContext('2d');
    const source = document.getElementById('treatSource');
    const ghost = document.getElementById('dragGhost');
    const modal = document.getElementById('profileModal');
    const openProfile = document.getElementById('showProfile');
    const closeProfile = document.getElementById('closeProfile');
    const announce = document.getElementById('announce');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const W=720, H=240, FLOOR=194, SCALE=4, MIN_X=58, MAX_X=W-58;
    const catConfigs = [
      {id:'boss',name:'BOSS',src:'cats/boss.png',idle:11,speed:38,rest:[11,23]},
      {id:'nox',name:'NOX',src:'cats/nox.png',idle:11,speed:72,rest:[1.8,4.1]},
      {id:'rich',name:'RICH',src:'cats/rich.png',idle:12,speed:33,rest:[15,29]}
    ];
    const cats = catConfigs.map(c => ({...c, x:0,target:0,dir:-1,walking:false,walkCycle:0,restTimer:0,
      blinkAt:0,blinkUntil:0,reactUntil:0,bubbleUntil:0,bubble:'',bubbleKind:'',pendingTreat:null,
      image:new Image(),ready:false}));
    const byId = Object.fromEntries(cats.map(c=>[c.id,c]));
    let dragPointer=null, dragStartX=0, dragStartY=0, dragMoved=false;
    let nextKeyboardCat=0, last=0, animationId=0;
    const rand=(a,b)=>a+Math.random()*(b-a);
    // The main website saves JP/EN in nulllatte-language. Read it even if the
    // shared i18n script has not finished initializing yet.
    function language(){
      const shared=window.NulllatteI18n?.language;
      if(shared==='en'||shared==='ja') return shared;
      try { return localStorage.getItem('nulllatte-language')==='en'?'en':'ja'; }
      catch (_) { return 'ja'; }
    }
    const copy={
      ja:{snack:'おやつ ∞',title:'猫部屋 / CAT ROOM',about:'このサイトについて',
        bossWork:'ノンストップランサー（没作品）',type:['/ 白猫','/ 黒猫','/ 茶白猫'],origin:'出演作品：',
        treatHint:'おやつを猫までドラッグ',close:'閉じる',room:'猫部屋',
        treatAria:'おやつ。ドラッグして猫にあげる。キーボードではEnterキーで順番にあげる。',
        stageAria:'猫3匹。クリックでなでる。Enterキーで順番になでられます。',
        portraits:['BOSSのドット絵','ノクス君のドット絵','RICHのドット絵'],descs:[
          '偉いのかどうかは不明。鎮座している。飼い主の賞金で悠々暮らしている。今はHPに居座っている。',
          '怪盗アルバの愛猫。活発で働き者。',
          '裕福なお姉さんの寵愛を受けている。働く必要がない。のんびり屋。'
        ],works:['今宵、君を奪いましょう♡','まだ閉めないで、店主様！']},
      en:{snack:'TREATS ∞',title:'CAT ROOM',about:'About This Site',
        bossWork:'Nonstop Lancer (Shelved Project)',type:['/ White cat','/ Black cat','/ Brown-and-white cat'],origin:'Appears in: ',
        treatHint:'Drag a treat to a cat',close:'Close',room:'Cat room',
        treatAria:'Drag unlimited treats to the cats, or press Enter to feed one.',
        stageAria:'Three cats. Click to pet one, or press Enter to pet them in turn.',
        portraits:['Pixel art of BOSS','Pixel art of NOX','Pixel art of RICH'],descs:[
          'No one knows if BOSS is actually in charge. They just sit there. Living comfortably off their owner’s prize money, they’ve now claimed a spot on this website.',
          'Alba the phantom thief’s beloved cat. Lively and hardworking.',
          'Pampered by a wealthy lady. No need to work. Just taking it easy.'
        ],works:['Tonight, I Shall Steal You ♡','Please Don’t Close Yet, Shopkeeper!']}
    };
    function updateLanguage(){
      const lang=language();
      const t=copy[lang];
      const en=lang==='en';
      document.documentElement.lang=lang;
      document.title=t.title+' | NULLLATTE';
      // The bilingual title's original Japanese sizing is preserved.
      document.getElementById('roomTitle').innerHTML=en?'CAT ROOM':'猫部屋 <span lang="en">/ CAT ROOM</span>';
      document.getElementById('roomContent').setAttribute('aria-label',t.room);
      document.getElementById('treatLabel').textContent=t.snack;
      source.title=t.treatHint;
      source.setAttribute('aria-label',t.treatAria);
      canvas.setAttribute('aria-label',t.stageAria);
      document.getElementById('closeProfile').setAttribute('aria-label',t.close);
      document.getElementById('linkBoss').textContent=t.about;
      document.getElementById('workBoss').textContent=t.bossWork;
      cats.forEach((c,i)=>{
        const suffix=c.id==='boss'?'Boss':c.id==='nox'?'Nox':'Rich';
        document.getElementById('type'+suffix).textContent=t.type[i];
        document.getElementById('desc'+suffix).textContent=t.descs[i];
        document.getElementById('origin'+suffix).textContent=t.origin;
        document.getElementById('portrait'+suffix).setAttribute('aria-label',t.portraits[i]);
      });
      document.getElementById('linkNox').textContent=t.works[0];
      document.getElementById('linkRich').textContent=t.works[1];
    }
    function randomPlace(){
      // Separated only at initial load; later movement deliberately allows passing each other.
      const slots=[140,355,575].sort(()=>Math.random()-.5);
      cats.forEach((c,i)=>{
        c.x=slots[i]+rand(-22,22);
        c.target=c.x;
        c.walking=false;
        c.restTimer=rand(c.rest[0],c.rest[1]);
        c.dir=Math.random()<.5?-1:1;
        c.blinkAt=performance.now()+rand(2400,6300);
      });
    }
    function chooseWalk(c){
      // No collision avoidance: cats can pass freely, even when following treats.
      const choices=[84,156,241,338,429,517,634].filter(x=>Math.abs(x-c.x)>85);
      c.target=choices[Math.floor(Math.random()*choices.length)] ?? rand(MIN_X,MAX_X);
      c.walking=true;
    }
    function feedCat(c,x){
      // One waiting treat per cat; the source itself is never consumed.
      c.pendingTreat={x:Math.max(MIN_X,Math.min(MAX_X,x))};
      c.target=c.pendingTreat.x;
      c.walking=true;
      c.reactUntil=0;
      announce.textContent=`${c.name} ${language()==='ja'?'におやつをあげました。':'got a treat.'}`;
      if(Math.abs(c.x-c.target)<6) eat(c,performance.now());
    }
    function eat(c,now){
      c.pendingTreat=null;
      c.target=c.x;
      c.walking=false;
      c.restTimer=rand(c.rest[0],c.rest[1]);
      c.reactUntil=now+1000;
      c.bubbleUntil=now+1650;
      c.bubble='♥';
      c.bubbleKind='treat';
    }
    function pet(c,now){
      c.reactUntil=now+620;
      c.bubbleUntil=now+1150;
      c.bubble=c.id==='nox'?'♪':c.id==='rich'?'♡':'♥';
      c.bubbleKind='pet';
      if(!c.pendingTreat){c.walking=false;c.target=c.x;c.restTimer=rand(2,5);}
      announce.textContent=c.name+(language()==='ja'?'をなでました。':' was petted.');
    }
    function update(dt,now){
      for(const c of cats){
        if(!c.pendingTreat && now<c.reactUntil) continue;
        if(!c.walking && !c.pendingTreat){
          c.restTimer-=dt;
          if(c.restTimer<=0 && !reducedMotion.matches) chooseWalk(c);
        }
        if(c.walking){
          const dx=c.target-c.x;
          if(Math.abs(dx)<=1.3){
            c.x=c.target;c.walking=false;
            if(c.pendingTreat) eat(c,now);
            else c.restTimer=rand(c.rest[0],c.rest[1]);
          }else if(!reducedMotion.matches || c.pendingTreat){
            const step=Math.sign(dx)*Math.min(Math.abs(dx),dt*c.speed);
            c.x+=step;
            c.dir=dx<0?-1:1;
            c.walkCycle+=dt;
          }
        }
        if(now>c.blinkAt){c.blinkUntil=now+180;c.blinkAt=now+rand(3400,7900);}
      }
    }
    function catFrame(c,now){
      if(now<c.reactUntil) return 0;
      if(c.walking && Math.abs(c.x-c.target)>1.3) return 2+(Math.floor(c.walkCycle/.17)%3);
      if(now<c.blinkUntil) return 1;
      return c.idle;
    }
    function drawTreat(x,y,size=3){
      // Pixel treat using only existing NULLLATTE palette colors.
      ctx.fillStyle='#78575e';ctx.fillRect(x-4*size,y-3*size,8*size,6*size);
      ctx.fillStyle='#584540';ctx.fillRect(x-3*size,y-2*size,6*size,4*size);
      ctx.fillStyle='#cca795';ctx.fillRect(x-2*size,y-1*size,2*size,size);
    }
    function drawCat(c,now){
      if(!c.ready) return;
      const frame=catFrame(c,now);
      const isSide=frame>=2&&frame<=4;
      const bottom=isSide?26:25;
      ctx.save();
      ctx.translate(Math.round(c.x),FLOOR);
      // Native side frames FACE LEFT (head left, tail right). Flip ONLY when heading right.
      if(isSide && c.dir>0) ctx.scale(-1,1);
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(c.image,frame*32,0,32,32,-16*SCALE,-bottom*SCALE,32*SCALE,32*SCALE);
      ctx.restore();
      if(now<c.bubbleUntil){
        const duration=c.bubbleKind==='treat'?1650:1150;
        const life=(c.bubbleUntil-now)/duration;
        const p=1-life;
        ctx.save();
        ctx.textAlign='center';
        ctx.font=(c.bubbleKind==='treat'?'bold 45px':'bold 33px')+' MaruMonica, monospace';
        ctx.fillStyle='#584540';
        ctx.globalAlpha=Math.min(1,life*2.5);
        ctx.fillText(c.bubble,Math.round(c.x),FLOOR-112-p*23);
        ctx.restore();
      }
    }
    function draw(now){
      ctx.fillStyle='#a37370';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#6b5258';ctx.fillRect(0,FLOOR,W,2);
      for(const c of cats) if(c.pendingTreat) drawTreat(Math.round(c.pendingTreat.x),FLOOR-9,2);
      for(const c of cats) drawCat(c,now);
    }
    function loop(now){
      const dt=last?Math.min((now-last)/1000,.06):0;last=now;
      if(!document.hidden) update(dt,now);
      draw(now);
      animationId=requestAnimationFrame(loop);
    }
    function canvasPoint(clientX,clientY){
      const r=canvas.getBoundingClientRect();
      if(clientX<r.left||clientX>r.right||clientY<r.top||clientY>r.bottom) return null;
      return {x:(clientX-r.left)*W/r.width,y:(clientY-r.top)*H/r.height};
    }
    function closestCat(x){return cats.reduce((a,c)=>Math.abs(c.x-x)<Math.abs(a.x-x)?c:a,cats[0]);}
    canvas.addEventListener('click', e=>{
      const p=canvasPoint(e.clientX,e.clientY);
      if(!p||p.y<55||p.y>FLOOR+10) return;
      const c=closestCat(p.x);
      if(Math.abs(c.x-p.x)<58) pet(c,performance.now());
    });
    canvas.addEventListener('keydown',e=>{
      if(e.key!=='Enter'&&e.key!==' ') return;
      e.preventDefault();pet(cats[nextKeyboardCat++%3],performance.now());
    });
    function ghostAt(e){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';}
    function stopDrag(){
      if(dragPointer===null) return;
      try{source.releasePointerCapture(dragPointer);}catch{}
      dragPointer=null;ghost.classList.remove('visible');
    }
    source.addEventListener('pointerdown',e=>{
      if(e.button!==0 && e.pointerType==='mouse') return;
      e.preventDefault();
      dragPointer=e.pointerId;dragStartX=e.clientX;dragStartY=e.clientY;dragMoved=false;
      source.setPointerCapture(e.pointerId);
      ghostAt(e);ghost.classList.add('visible');
    });
    source.addEventListener('pointermove',e=>{
      if(e.pointerId!==dragPointer) return;
      if(Math.hypot(e.clientX-dragStartX,e.clientY-dragStartY)>8) dragMoved=true;
      ghostAt(e);
    });
    source.addEventListener('pointerup',e=>{
      if(e.pointerId!==dragPointer) return;
      const p=canvasPoint(e.clientX,e.clientY);
      if(p) feedCat(closestCat(p.x),p.x);
      else if(!dragMoved) feedCat(cats[nextKeyboardCat++%3],cats[(nextKeyboardCat-1)%3].x);
      stopDrag();
      source.dataset.suppressClick='1';
    });
    source.addEventListener('pointercancel',stopDrag);
    source.addEventListener('lostpointercapture',()=>{dragPointer=null;ghost.classList.remove('visible');});
    source.addEventListener('click',e=>{
      // Click following pointerup is already handled. Keyboard-triggered click feeds a cat.
      if(source.dataset.suppressClick){delete source.dataset.suppressClick;return;}
      const c=cats[nextKeyboardCat++%3];feedCat(c,c.x);
    });
    openProfile.addEventListener('click',()=>modal.showModal());
    closeProfile.addEventListener('click',()=>modal.close());
    modal.addEventListener('click',e=>{if(e.target===modal) modal.close();});
    modal.addEventListener('close',()=>openProfile.focus());
    function drawPortrait(c){
      const dst=document.getElementById('portrait'+c.id[0].toUpperCase()+c.id.slice(1));
      const dc=dst.getContext('2d');dc.clearRect(0,0,32,32);dc.imageSmoothingEnabled=false;
      dc.drawImage(c.image,0,0,32,32,0,0,32,32);
    }
    for(const c of cats){
      c.image.onload=()=>{c.ready=true;drawPortrait(c);draw(performance.now());};
      c.image.onerror=()=>{announce.textContent=`${c.src} could not be loaded.`;};
      c.image.src=c.src;
    }
    window.addEventListener('nulllatte:languagechange',updateLanguage);
    document.addEventListener('DOMContentLoaded',updateLanguage,{once:true});
    window.addEventListener('storage',e=>{if(e.key==='nulllatte-language')updateLanguage();});
    document.addEventListener('visibilitychange',()=>{last=0;});
    reducedMotion.addEventListener?.('change',()=>{
      if(reducedMotion.matches){for(const c of cats) if(!c.pendingTreat){c.walking=false;c.target=c.x;}}
    });
    randomPlace();updateLanguage();animationId=requestAnimationFrame(loop);
    window.addEventListener('pagehide',()=>{cancelAnimationFrame(animationId);animationId=0;});
    window.addEventListener('pageshow',e=>{updateLanguage();if(e.persisted){last=0;if(!animationId)animationId=requestAnimationFrame(loop);}});
  })();
  </script>
</body>
</html>
