<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLYPH FIELD | NULLLATTE</title>
<link rel="icon" href="../images/favicon.png">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DZBDZFFZ6J"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-DZBDZFFZ6J");</script>
<style>
@font-face { font-family:MaruMonica; src:url('../fonts/MaruMonica.ttf') format('truetype'); font-display:swap; }
:root { --ink:#3a323c; --plum:#6b5258; --rose:#a37370; --peach:#cca795; --paper:#d7c1b4; --cream:#ded0c7; --panel:#e9d9ce; }
* { box-sizing:border-box; }
html { min-height:100%; background:var(--cream); }
body { min-height:100%; margin:0; color:var(--ink); background:var(--cream); font:16px/1.5 MaruMonica,ui-monospace,monospace; }
button,a { font:inherit; color:inherit; }
a { text-decoration:none; }
button:focus-visible,a:focus-visible,canvas:focus-visible { outline:3px solid var(--plum); outline-offset:3px; }
.site { max-width:850px; margin:0 auto; padding:10px 12px 16px; height:100vh; height:100dvh; min-height:260px; display:flex; flex-direction:column; }
.site-top { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:0 3px 9px; flex:none; }
.brand { font-size:12px; font-weight:900; letter-spacing:.13em; }
.back { font-size:11px; border:1px solid var(--rose); border-radius:999px; padding:6px 10px; white-space:nowrap; }
.stage { position:relative; flex:1; min-height:0; display:grid; grid-template-rows: minmax(0,1fr) 38px; overflow:hidden; background:var(--panel); border:2px solid var(--plum); border-radius:13px; box-shadow:5px 6px 0 #cca79566; }
.stage canvas { display:block; width:100%; height:100%; min-height:0; touch-action:none; cursor:default; }
.stage canvas:focus-visible { outline-offset:-5px; }
.stage-label { position:absolute; top:10px; left:14px; font-size:13px; line-height:1.4; font-weight:normal; letter-spacing:.10em; color:var(--plum); margin:0; pointer-events:none; }
.readout { display:flex; align-items:center; justify-content:center; text-align:center; padding:0 10px; font-size:clamp(13px,2vw,18px); line-height:1.2; color:var(--plum); pointer-events:none; overflow-wrap:anywhere; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
@media(max-width:540px) { .site { padding:8px 7px 10px; } .brand,.back { font-size:10px; } .stage { border-radius:9px; box-shadow:3px 4px 0 #cca79566; } .stage-label { font-size:11px; left:10px; top:8px; } }
</style>
</head>
<body>
<div class="site">
    <div class="site-top">
      <div class="brand">NULLLATTE / PLAYGROUND</div>
      <a class="back" href="../playground.html">← PLAYGROUND</a>
    </div>
    <main class="stage" aria-labelledby="glyph-title">
      <canvas id="field" tabindex="0" aria-label="ゲームのタイトルでできたマグカップ。マウスや指でなぞると文字が散ります。キーボードではスペースまたはEnterで散らせます。"></canvas>
      <h1 class="stage-label" id="glyph-title">GLYPH FIELD</h1><span class="sr-only" id="count"></span>
      <div class="readout" id="readout" aria-live="off"></div>
    </main>
</div>
<script src="../games-data.js"></script>
<script>
(() => {
'use strict';
const fallback=["SILVER VINE WINERY", "お姉さん、まだ寝てて。", "ヤマカンアクマ", "検閲♡おしおきバレンタイン", "WAKE ME NOT", "着いたよ。下。三分ね。", "だーれだ？", "今宵、君を奪いましょう♡", "BUNNY BAR DIORAMA", "スパっと！シがーる", "中略！コラボカフェ", "ワードランド診断", "WHY CAN'T I RUN?!", "小さなゲームをつくりたい", "まだ閉めないで、店主様！", "ふた文字、貢げ！", "CLUNK OR PASS!", "LAST ONE", "ぎゅーっとコール！", "♡？"];
const games=window.NULLLATTE_GAMES;
const titles=Array.isArray(games)&&games.length?games.map(g=>g.title).filter(t=>typeof t==='string'&&t.length):fallback;
const palette={o:'#3a323c',p:'#a37370',s:'#cca795'};
const mask=["................................", "................................", "................................", "................................", "...........o..o..o..............", "...........o..o..o..............", "..........o..o..o...............", "..........o..o..o...............", "...........o..o..o..............", "...........o..o..o..............", "................................", "................................", "........oooooooooooooo..........", "........oppppppppppppo..........", "........oppppppppppppo..........", "........oppppppppppppoooo.......", "........oppppppppppppopppo......", "........oppppppppppppooopo......", "........oppppppppppppo.opo......", "........oppppppppppppo.opo......", "........oppppppppppppooppo......", "........ossssssssssssoppo.......", "........ossssssssssssooo........", "........oppppppppppppo..........", "........oppppppppppppo..........", ".........oooooooooooo...........", "................................", "................................", "................................", "................................", "................................", "................................"];
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d');
const count=document.getElementById('count'),readout=document.getElementById('readout');
count.textContent=`${titles.length} GAMES`;
const chars=titles.flatMap((title,index)=>[...Array.from(title).map(ch=>({ch,title,index})),{ch:' ',title,index}]);
const points=[];let k=0;
// Two glyphs per axis for each coloured pixel of the original coffee logo.
for(let y=0;y<mask.length*2;y++) for(let x=0;x<mask[0].length*2;x++){
  const color=palette[mask[Math.floor(y/2)][Math.floor(x/2)]];
  if(!color)continue;
  const entry=chars[k++%chars.length];
  points.push({gx:(x+.5)/2,gy:(y+.5)/2,steam:y<24,color,...entry});
}
let particles=[],width=0,height=0,step=1,dpr=1,last=0,frameId=0;
const pointer={active:false,id:null,x:0,y:0};
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const neutral='';
function layout(){
  const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;
  width=r.width;height=r.height;dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  step=Math.min(width*.88/18,Math.max(1,height-46)*.96/22);
  const cx=17.5,cy=15;
  particles=points.map(p=>{const tx=width/2+(p.gx-cx)*step,ty=height/2+(p.gy-cy)*step;return {...p,tx,ty,hx:tx,hy:ty,x:tx,y:ty,vx:0,vy:0};});
  pointer.active=false;pointer.id=null;readout.textContent=neutral;
  last=0;draw(0,false);
}
function draw(t,animate=true){
  if(!width)return;
  const dt=last?Math.min(2,(t-last)/16.667):1;last=t;
  ctx.clearRect(0,0,width,height);
  const radius=Math.max(30,step*3.5);
  const size=step*.50;
  ctx.font=`600 ${size}px MaruMonica, "Noto Sans CJK JP", "Yu Gothic", sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of particles){
    // Steam gently sways; the cup stays completely still at rest.
    const sway=p.steam&&!reduced.matches;
    const phase=t*.0015+p.gx*.32-p.gy*.34;
    p.hx=p.tx+(sway?Math.sin(phase)*step*.24:0);
    p.hy=p.ty+(sway?Math.cos(phase*.82)*step*.07:0);
    if(animate){
      if(pointer.active){const dx=p.x-pointer.x,dy=p.y-pointer.y,r=Math.hypot(dx,dy);if(r<radius){const force=(radius-r)*.074*dt;const angle=(p.gx*13.1+p.gy*7.7);p.vx+=(r>.01?dx/r:Math.cos(angle))*force;p.vy+=(r>.01?dy/r:Math.sin(angle))*force;}}
      p.vx=(p.vx+(p.hx-p.x)*.035*dt)*Math.pow(.86,dt);p.vy=(p.vy+(p.hy-p.y)*.035*dt)*Math.pow(.86,dt);
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(!pointer.active&&Math.abs(p.x-p.hx)+Math.abs(p.y-p.hy)+Math.abs(p.vx)+Math.abs(p.vy)<.035){p.x=p.hx;p.y=p.hy;p.vx=0;p.vy=0;}
    }
    ctx.fillStyle=p.color;ctx.fillText(p.ch,p.x,p.y);
  }
}
function tick(t){draw(t);frameId=requestAnimationFrame(tick);}
function position(e){const b=canvas.getBoundingClientRect();pointer.x=e.clientX-b.left;pointer.y=e.clientY-b.top;pointer.active=true;
  let best=null,dist=Infinity;for(const p of particles){if(p.ch===' ')continue;const d=(p.hx-pointer.x)**2+(p.hy-pointer.y)**2;if(d<dist){dist=d;best=p;}}
  if(best&&dist<(step*1.8)**2)readout.textContent=best.title;
}
function clear(e){if(e&&pointer.id!==null&&e.pointerId!==pointer.id)return;pointer.active=false;pointer.id=null;readout.textContent=neutral;}
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.pointerId===pointer.id)position(e);});
canvas.addEventListener('pointerdown',e=>{if(pointer.id!==null)return;pointer.id=e.pointerId;position(e);if(e.pointerType!=='mouse')canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',clear);canvas.addEventListener('pointercancel',clear);canvas.addEventListener('lostpointercapture',clear);canvas.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')clear(e);});window.addEventListener('blur',()=>clear());
canvas.addEventListener('keydown',e=>{if(e.code!=='Space'&&e.code!=='Enter')return;e.preventDefault();for(const p of particles){const dx=p.x-width/2,dy=p.y-height/2,r=Math.hypot(dx,dy)||1;p.vx+=dx/r*step*.65;p.vy+=dy/r*step*.65;}});
// Stop the animation when the document is hidden and reset elapsed time on return.
function stop(){cancelAnimationFrame(frameId);frameId=0;clear();}
function resume(){if(!frameId&&!document.hidden){last=0;frameId=requestAnimationFrame(tick);}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else resume();});
window.addEventListener('pagehide',stop);window.addEventListener('pageshow',resume);
new ResizeObserver(layout).observe(canvas);layout();document.fonts?.ready.then(()=>draw(performance.now(),false));frameId=requestAnimationFrame(tick);
})();
</script>
</body>
</html>
